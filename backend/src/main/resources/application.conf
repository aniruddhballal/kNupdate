ktor {
    deployment {
        host = ${?APP_HOST}
        port = 8080
    }

    application {
        modules = [ com.knupdate.backend.ApplicationKt.module ]
    }
}

app {
    environment = ${?APP_ENV}
    development-otp = ${?DEVELOPMENT_OTP}
    seed-user-ids = ${?SEED_USER_IDS}
}

database {
    jdbc-url = ${?DATABASE_URL}
    ssl-mode = ${?DATABASE_SSL_MODE}
}
