services:
  postgres:
    image: postgres:16-alpine
    container_name: knupdate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knupdate
      POSTGRES_USER: knupdate
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - knupdate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knupdate -d knupdate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  knupdate-postgres-data:
